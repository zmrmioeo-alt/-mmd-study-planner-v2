name: Build private MMD APK
on:
  push:
    branches: [mmd-private-apk]
    paths:
      - 'private-app/**'
      - 'capacitor.config.json'
      - 'package.json'
      - '.github/workflows/private-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Capacitor
        run: npm install
      - name: Prepare private app bundle
        run: |
          mkdir -p www
          cp private-app/index.html www/index.html
          cp private-app/private.css www/private.css
          cp private-app/private.js www/private.js
      - name: Generate Android project
        run: npx cap add android
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Upload private APK
        uses: actions/upload-artifact@v4
        with:
          name: MMD-Private-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
