name: Build Android APK

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 */5 * *'
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'index.html'
      - 'style.css'
      - 'upland.css'
      - 'experience.css'
      - 'experience.js'
      - 'planner-edit.js'
      - 'stickers.js'
      - 'assets/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'manifest.webmanifest'
      - 'service-worker.js'
      - 'install.html'
      - 'version.json'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  keep-signing-key-warm:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Restore stable Android signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: upland-android-debug-signing-key-v1
      - name: Ensure stable Android signing key
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

  android:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check service-worker.js
          node --check experience.js
          node --check planner-edit.js
          node --check stickers.js

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Restore stable Android signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: upland-android-debug-signing-key-v1

      - name: Ensure stable Android signing key
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Prepare bundled web assets
        run: |
          mkdir -p www/assets
          cp index.html app.js style.css upland.css experience.css experience.js planner-edit.js stickers.js version.json manifest.webmanifest service-worker.js install.html privacy.html www/
          cp -R assets/. www/assets/

      - name: Generate Android project
        run: npx cap add android

      - name: Apply official UPLAND launcher icon
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick librsvg2-bin
          rsvg-convert -w 512 -h 512 assets/upland-install-icon.svg > /tmp/upland-icon.png
          for spec in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $spec
            density="$1"
            size="$2"
            dir="android/app/src/main/res/mipmap-$density"
            mkdir -p "$dir"
            convert /tmp/upland-icon.png -resize ${size}x${size} "$dir/ic_launcher.png"
            convert /tmp/upland-icon.png -resize ${size}x${size} "$dir/ic_launcher_round.png"
            convert /tmp/upland-icon.png -resize $((size*2))x$((size*2)) -gravity center -background none -extent $((size*2))x$((size*2)) "$dir/ic_launcher_foreground.png"
          done

      - name: Sync Capacitor
        run: npx cap sync android


      - name: Add native Hamkelasi in-app portal
        run: |
          mkdir -p android/app/src/main/java/com/mmd/studyplanner
          cat > android/app/src/main/java/com/mmd/studyplanner/HamkelasiPortalPlugin.java <<'JAVA'
          package com.mmd.studyplanner;
          import android.app.Dialog;
          import android.graphics.Color;
          import android.graphics.Typeface;
          import android.os.Build;
          import android.view.ViewGroup;
          import android.webkit.CookieManager;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import org.json.JSONObject;
          import org.json.JSONTokener;

          @CapacitorPlugin(name = "HamkelasiPortal")
          public class HamkelasiPortalPlugin extends Plugin {
              private Dialog dialog;
              private WebView webView;
              private PluginCall activeCall;
              private TextView address;
              @PluginMethod
              public void openPortal(PluginCall call) {
                  if (dialog != null && dialog.isShowing()) { call.reject("پنجرهٔ همکلاسی از قبل باز است."); return; }
                  activeCall = call;
                  getActivity().runOnUiThread(() -> {
                      LinearLayout root = new LinearLayout(getContext()); root.setOrientation(LinearLayout.VERTICAL); root.setBackgroundColor(Color.WHITE);
                      LinearLayout bar = new LinearLayout(getContext()); bar.setOrientation(LinearLayout.VERTICAL); bar.setPadding(18,14,18,10); bar.setBackgroundColor(Color.rgb(12,24,48));
                      TextView title = new TextView(getContext()); title.setText("ورود امن به همکلاسی"); title.setTextColor(Color.WHITE); title.setTextSize(17); title.setTypeface(null, Typeface.BOLD);
                      address = new TextView(getContext()); address.setText("hemmatsch.ir"); address.setTextColor(Color.rgb(180,205,240)); address.setTextSize(12);
                      bar.addView(title); bar.addView(address); root.addView(bar,new LinearLayout.LayoutParams(-1,-2));
                      webView = new WebView(getContext()); WebSettings settings=webView.getSettings(); settings.setJavaScriptEnabled(true); settings.setDomStorageEnabled(true); settings.setDatabaseEnabled(true); settings.setLoadWithOverviewMode(true); settings.setUseWideViewPort(true); settings.setJavaScriptCanOpenWindowsAutomatically(false); settings.setSupportMultipleWindows(false);
                      CookieManager.getInstance().setAcceptCookie(true); if(Build.VERSION.SDK_INT>=21) CookieManager.getInstance().setAcceptThirdPartyCookies(webView,true);
                      webView.setWebChromeClient(new WebChromeClient());
                      webView.setWebViewClient(new WebViewClient(){ @Override public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request){return false;} @Override public void onPageFinished(WebView view,String url){if(address!=null)address.setText(url);} });
                      root.addView(webView,new LinearLayout.LayoutParams(-1,0,1));
                      LinearLayout actions=new LinearLayout(getContext()); actions.setPadding(12,8,12,8);
                      Button sync=new Button(getContext()); sync.setText("گرفتن تکالیف از این صفحه"); Button close=new Button(getContext()); close.setText("بستن");
                      actions.addView(sync,new LinearLayout.LayoutParams(0,-2,2)); actions.addView(close,new LinearLayout.LayoutParams(0,-2,1)); root.addView(actions);
                      dialog=new Dialog(getContext()); dialog.setContentView(root);
                      dialog.setOnDismissListener(d->{if(webView!=null){webView.stopLoading();webView.destroy();webView=null;}dialog=null;if(activeCall!=null){activeCall.reject("پنجرهٔ همکلاسی بسته شد.");activeCall=null;}});
                      close.setOnClickListener(v->dialog.dismiss());
                      sync.setOnClickListener(v->{if(webView==null||activeCall==null)return;sync.setEnabled(false);
                          String script="(function(){var tables=Array.from(document.querySelectorAll('table,[role=table]')).map(function(t){var trs=Array.from(t.querySelectorAll('tr,[role=row]'));if(!trs.length)return null;var cellsOf=function(tr){return Array.from(tr.querySelectorAll('th,td,[role=cell],[role=gridcell]')).map(function(x){return (x.innerText||x.textContent||'').trim()})};var headers=cellsOf(trs[0]);var rows=trs.slice(1).map(function(tr){var cells=cellsOf(tr),o={};cells.forEach(function(v,i){o[headers[i]||('ستون '+(i+1))]=v});return o}).filter(function(o){return Object.values(o).some(Boolean)});return {headers:headers,rows:rows}}).filter(Boolean);var cards=Array.from(document.querySelectorAll('article,[class*=task-item],[class*=assignment-item],[data-task-id]')).filter(function(el){return el.offsetParent!==null}).map(function(el,i){return {'عنوان':(el.querySelector('h1,h2,h3,h4,[class*=title]')||el).innerText.trim().slice(0,300),'توضیحات':el.innerText.trim().slice(0,1500)}}).filter(function(o){return o['عنوان']});if(cards.length)tables.push({headers:['عنوان','توضیحات'],rows:cards});return JSON.stringify({title:document.title,url:location.href,tables:tables,body:(document.body&&document.body.innerText||'').slice(0,20000)})})()";
                          webView.evaluateJavascript(script,value->{try{Object parsed=new JSONTokener(value).nextValue();if(!(parsed instanceof String))throw new Exception("پاسخ صفحه قابل خواندن نیست.");JSONObject snapshot=new JSONObject((String)parsed);JSObject result=new JSObject();result.put("snapshot",snapshot.toString());activeCall.resolve(result);activeCall=null;dialog.dismiss();}catch(Exception e){sync.setEnabled(true);android.widget.Toast.makeText(getContext(),"خواندن صفحه ممکن نشد؛ صفحهٔ تکالیف را باز کن.",android.widget.Toast.LENGTH_LONG).show();}});
                      });
                      dialog.show();dialog.getWindow().setLayout(ViewGroup.LayoutParams.MATCH_PARENT,ViewGroup.LayoutParams.MATCH_PARENT);webView.loadUrl("https://hemmatsch.ir/");
                  });
              }
          }
          JAVA
          cat > android/app/src/main/java/com/mmd/studyplanner/MainActivity.java <<'JAVA'
          package com.mmd.studyplanner;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
              @Override public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(HamkelasiPortalPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          }
          JAVA

      - name: Build installable APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare release metadata
        id: release
        run: |
          VERSION=$(node -p "require('./version.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          cp android/app/build/outputs/apk/debug/app-debug.apk "UPLAND-$VERSION.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "UPLAND-latest.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: UPLAND-Android-${{ steps.release.outputs.version }}
          path: |
            UPLAND-${{ steps.release.outputs.version }}.apk
            UPLAND-latest.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.release.outputs.version }}
          name: UPLAND ${{ steps.release.outputs.version }}
          target_commitish: main
          body: |
            نسخه نصب‌شدنی اندروید UPLAND

            ${{ github.event.head_commit.message }}
          files: |
            UPLAND-${{ steps.release.outputs.version }}.apk
            UPLAND-latest.apk
          make_latest: true
          fail_on_unmatched_files: true
