name: Build Android APK

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 */5 * *'
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'index.html'
      - 'style.css'
      - 'upland.css'
      - 'experience.css'
      - 'experience.js'
      - 'planner-edit.js'
      - 'stickers.js'
      - 'assets/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'manifest.webmanifest'
      - 'service-worker.js'
      - 'install.html'
      - 'version.json'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  keep-signing-key-warm:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Restore stable Android signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: upland-android-debug-signing-key-v1
      - name: Verify signing key cache
        run: test -f ~/.android/debug.keystore

  android:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check service-worker.js
          node --check experience.js
          node --check planner-edit.js
          node --check stickers.js

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Restore stable Android signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: upland-android-debug-signing-key-v1

      - name: Prepare bundled web assets
        run: |
          mkdir -p www/assets
          cp index.html app.js style.css upland.css experience.css experience.js planner-edit.js stickers.js version.json manifest.webmanifest service-worker.js install.html privacy.html www/
          cp -R assets/. www/assets/

      - name: Generate Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build installable APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare release metadata
        id: release
        run: |
          VERSION=$(node -p "require('./version.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          cp android/app/build/outputs/apk/debug/app-debug.apk "UPLAND-$VERSION.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "UPLAND-latest.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: UPLAND-Android-${{ steps.release.outputs.version }}
          path: |
            UPLAND-${{ steps.release.outputs.version }}.apk
            UPLAND-latest.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.release.outputs.version }}
          name: UPLAND ${{ steps.release.outputs.version }}
          target_commitish: main
          body: |
            نسخه نصب‌شدنی اندروید UPLAND

            ${{ github.event.head_commit.message }}
          files: |
            UPLAND-${{ steps.release.outputs.version }}.apk
            UPLAND-latest.apk
          make_latest: true
          fail_on_unmatched_files: true
