name: UPLAND quality checks

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check experience.js
          node --check service-worker.js
          node --check planner-edit.js
          node --check stickers.js
      - name: Validate app assets and release metadata
        run: node scripts/validate-staging.mjs
